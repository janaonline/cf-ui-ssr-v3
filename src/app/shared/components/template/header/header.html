  <header class="border-bottom">
    <div class="container d-none d-md-flex justify-content-between align-items-center py-1 px-0">
      <div>
        <img src="./assets/images/emblem-of-india.svg" width="16" alt="Emblem of India" class="me-2" />
        <span class="custom-font-size-8">MINISTRY OF HOUSING AND URBAN AFFAIRS | GOVERNMENT OF INDIA</span>
      </div>
      <div>
        <button (click)="scrollToMainContent()" class="btn custom-font-size-7 me-2 text-decoration-none text-cfPrimary">
          Skip To Main Content
        </button>
        @for (size of textSize; track $index) {
        <button type="button" class="text-{{ size }} cursor-pointer btn btn-outline-dark active"
          [class.active]="currentTextSize === size" (click)="setFontSize(size)">
          A
        </button>
        }
      </div>
    </div>
  </header>

  <!-- ngSkipHydration: nav item visibility depends on isLoggedIn, which is only ever false during
       SSR (no session available on the server) — so auth-gated items like "My Modules" are never
       in the server-rendered HTML, only inserted later once the client resolves the real session.
       That late, hydration-grafted insertion is why its icon (a web-font glyph on a ::before
       pseudo-element) can render blank: if it lands after the icon font's own load-triggered
       repaint has already happened, nothing re-scans it for the now-ready glyph. Skipping
       hydration makes Angular fully re-render the header client-side in one clean pass instead of
       grafting onto a server-painted tree that never had these items, so everything (icon
       included) paints together once real auth state is known. -->
  <app-navbar ngSkipHydration></app-navbar>
</div>
